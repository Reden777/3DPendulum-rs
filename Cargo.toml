[package]
name = "pendulum-3d"
version = "0.1.7"
edition = "2021"
description = "A headless 3D pendulum and die for divination"
license = "0BSD"
repository = "https://github.com/Reden777/3DPendulum-rs.git"

[[bin]]
name = "pendulum-3d"
path = "src/main.rs"

[[bin]]
name = "die"
path = "src/die.rs"

[dependencies]
rapier3d = "0.22"
rand = "0.8"
getrandom = "0.2"
ureq = { version = "2.12", optional = true }

[features]
default = []
randomorg = ["dep:ureq"]
